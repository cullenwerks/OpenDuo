<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- GitLab orange gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FC6D26"/>
      <stop offset="100%" stop-color="#E24329"/>
    </linearGradient>
    <!-- Warm inner glow -->
    <radialGradient id="glow" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FCA326" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E24329" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="248" height="248" rx="48" ry="48" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="48" ry="48" fill="url(#glow)"/>

  <!-- === IDE Window === -->
  <g transform="translate(44, 46)">
    <!-- Window shadow -->
    <rect x="3" y="3" width="130" height="150" rx="8" fill="rgba(0,0,0,0.1)"/>

    <!-- Window body -->
    <rect x="0" y="0" width="130" height="150" rx="8" fill="white" opacity="0.95"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="130" height="20" rx="8" fill="rgba(255,255,255,0.7)"/>
    <rect x="0" y="10" width="130" height="10" fill="rgba(255,255,255,0.7)"/>

    <!-- Window controls (traffic lights) -->
    <circle cx="14" cy="10" r="3.5" fill="#E24329" opacity="0.7"/>
    <circle cx="26" cy="10" r="3.5" fill="#FCA326" opacity="0.7"/>
    <circle cx="38" cy="10" r="3.5" fill="#7CB342" opacity="0.5"/>

    <!-- Activity bar (left sidebar) -->
    <rect x="0" y="20" width="18" height="130" fill="rgba(230,100,40,0.12)"/>
    <rect x="0" y="140" width="18" height="10" rx="0" ry="0" fill="rgba(230,100,40,0.12)"/>
    <!-- Round bottom-left corner -->

    <!-- Sidebar icons (abstract) -->
    <rect x="5" y="30" width="8" height="8" rx="2" fill="#E24329" opacity="0.3"/>
    <rect x="5" y="44" width="8" height="8" rx="2" fill="#FC6D26" opacity="0.25"/>
    <rect x="5" y="58" width="8" height="8" rx="2" fill="#FCA326" opacity="0.2"/>

    <!-- Code area -->
    <!-- Line numbers gutter -->
    <rect x="18" y="20" width="12" height="130" fill="rgba(0,0,0,0.03)"/>

    <!-- Code lines -->
    <rect x="34" y="28" width="36" height="3" rx="1.5" fill="#E24329" opacity="0.35"/>
    <rect x="40" y="36" width="48" height="3" rx="1.5" fill="#FC6D26" opacity="0.22"/>
    <rect x="40" y="44" width="32" height="3" rx="1.5" fill="#FCA326" opacity="0.28"/>
    <rect x="34" y="52" width="52" height="3" rx="1.5" fill="#E24329" opacity="0.18"/>
    <rect x="40" y="60" width="28" height="3" rx="1.5" fill="#FC6D26" opacity="0.25"/>
    <rect x="40" y="68" width="44" height="3" rx="1.5" fill="#FCA326" opacity="0.2"/>
    <rect x="34" y="76" width="38" height="3" rx="1.5" fill="#E24329" opacity="0.3"/>
    <rect x="40" y="84" width="50" height="3" rx="1.5" fill="#FC6D26" opacity="0.18"/>
    <rect x="40" y="92" width="26" height="3" rx="1.5" fill="#FCA326" opacity="0.22"/>
    <rect x="34" y="100" width="42" height="3" rx="1.5" fill="#E24329" opacity="0.2"/>
    <rect x="40" y="108" width="54" height="3" rx="1.5" fill="#FC6D26" opacity="0.15"/>
    <rect x="40" y="116" width="30" height="3" rx="1.5" fill="#FCA326" opacity="0.2"/>
    <rect x="34" y="124" width="46" height="3" rx="1.5" fill="#E24329" opacity="0.18"/>
    <rect x="40" y="132" width="36" height="3" rx="1.5" fill="#FC6D26" opacity="0.22"/>
    <rect x="34" y="140" width="24" height="3" rx="1.5" fill="#FCA326" opacity="0.15"/>
  </g>

  <!-- === AI Chat Bubble (overlapping bottom-right) === -->
  <g transform="translate(144, 148)">
    <!-- Bubble shadow -->
    <rect x="2" y="2" width="78" height="58" rx="14" fill="rgba(0,0,0,0.08)"/>

    <!-- Bubble body -->
    <rect x="0" y="0" width="78" height="58" rx="14" fill="white" opacity="0.97"/>

    <!-- Bubble tail -->
    <path d="M12,58 L20,58 L6,72 Z" fill="white" opacity="0.97"/>
    <path d="M14,60 L22,60 L8,74 Z" fill="rgba(0,0,0,0.08)"/>
    <path d="M12,58 L20,58 L6,72 Z" fill="white" opacity="0.97"/>

    <!-- AI response lines (representing generated text) -->
    <rect x="14" y="14" width="50" height="3.5" rx="1.75" fill="#E24329" opacity="0.45"/>
    <rect x="14" y="23" width="42" height="3.5" rx="1.75" fill="#FC6D26" opacity="0.35"/>
    <rect x="14" y="32" width="52" height="3.5" rx="1.75" fill="#FCA326" opacity="0.4"/>
    <rect x="14" y="41" width="30" height="3.5" rx="1.75" fill="#E24329" opacity="0.25"/>
  </g>

  <!-- === AI Sparkles (4-pointed stars) === -->

  <!-- Large sparkle: top-right -->
  <g transform="translate(218, 46)" fill="white">
    <path d="M0,-16 C1.5,-5 5,-1.5 16,0 C5,1.5 1.5,5 0,16 C-1.5,5 -5,1.5 -16,0 C-5,-1.5 -1.5,-5 0,-16Z" opacity="0.95"/>
  </g>

  <!-- Medium sparkle: top-center -->
  <g transform="translate(158, 34)" fill="white">
    <path d="M0,-10 C1,-3.5 3.5,-1 10,0 C3.5,1 1,3.5 0,10 C-1,3.5 -3.5,1 -10,0 C-3.5,-1 -1,-3.5 0,-10Z" opacity="0.8"/>
  </g>

  <!-- Small sparkle: left -->
  <g transform="translate(32, 128)" fill="white">
    <path d="M0,-8 C0.7,-2.8 2.8,-0.7 8,0 C2.8,0.7 0.7,2.8 0,8 C-0.7,2.8 -2.8,0.7 -8,0 C-2.8,-0.7 -0.7,-2.8 0,-8Z" opacity="0.65"/>
  </g>

  <!-- Tiny sparkle: top-left -->
  <g transform="translate(60, 36)" fill="white">
    <path d="M0,-6 C0.5,-2 2,-0.5 6,0 C2,0.5 0.5,2 0,6 C-0.5,2 -2,0.5 -6,0 C-2,-0.5 -0.5,-2 0,-6Z" opacity="0.6"/>
  </g>

  <!-- Tiny sparkle: right-middle -->
  <g transform="translate(236, 136)" fill="white">
    <path d="M0,-6 C0.5,-2 2,-0.5 6,0 C2,0.5 0.5,2 0,6 C-0.5,2 -2,0.5 -6,0 C-2,-0.5 -0.5,-2 0,-6Z" opacity="0.55"/>
  </g>

  <!-- Small sparkle: bottom-center -->
  <g transform="translate(120, 232)" fill="white">
    <path d="M0,-7 C0.6,-2.5 2.5,-0.6 7,0 C2.5,0.6 0.6,2.5 0,7 C-0.6,2.5 -2.5,0.6 -7,0 C-2.5,-0.6 -0.6,-2.5 0,-7Z" opacity="0.5"/>
  </g>

  <!-- Medium sparkle: near chat bubble -->
  <g transform="translate(230, 190)" fill="white">
    <path d="M0,-9 C0.8,-3 3,-0.8 9,0 C3,0.8 0.8,3 0,9 C-0.8,3 -3,0.8 -9,0 C-3,-0.8 -0.8,-3 0,-9Z" opacity="0.7"/>
  </g>
</svg>
