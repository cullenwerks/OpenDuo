name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

jobs:
  # ── TEST ──────────────────────────────────────────────────────────

  ts-test:
    name: TypeScript Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p tsconfig.webview.json
      - run: npx tsc --noEmit -p tsconfig.server.json

  ts-audit:
    name: TypeScript Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── BUILD ─────────────────────────────────────────────────────────

  ts-build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [ts-test, ts-lint]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 1

  # ── PACKAGE ───────────────────────────────────────────────────────

  vsix-package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [ts-build]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
      - run: npm ci
      - name: Determine version tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"
      - run: npx vsce package --out openduo-${{ steps.version.outputs.tag }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: extension/openduo-*.vsix
          retention-days: 7

  # ── RELEASE ───────────────────────────────────────────────────────

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [vsix-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix-package
      - uses: softprops/action-gh-release@v2
        with:
          name: "OpenDuo ${{ github.ref_name }}"
          body: "OpenDuo VS Code Extension"
          files: openduo-*.vsix
