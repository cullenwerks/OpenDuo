stages:
  - test
  - build
  - package
  - release

# ── TEST ──────────────────────────────────────────────────────────

ts:test:
  stage: test
  image: node:20
  script:
    - cd extension
    - npm ci
    - npm test
  cache:
    key: node-cache
    paths: [extension/node_modules/]

ts:lint:
  stage: test
  image: node:20
  script:
    - cd extension
    - npm ci
    - npx tsc --noEmit
    - npx tsc --noEmit -p tsconfig.webview.json
    - npx tsc --noEmit -p tsconfig.server.json
  cache:
    key: node-cache
    paths: [extension/node_modules/]

ts:audit:
  stage: test
  image: node:20
  script:
    - cd extension
    - npm ci
    - npm audit --audit-level=high
  cache:
    key: node-cache
    paths: [extension/node_modules/]

# ── BUILD ─────────────────────────────────────────────────────────

ts:build:
  stage: build
  image: node:20
  script:
    - cd extension
    - npm ci
    - npm run build
  artifacts:
    paths:
      - extension/dist/
    expire_in: 1 hour
  cache:
    key: node-cache
    paths: [extension/node_modules/]

# ── PACKAGE ───────────────────────────────────────────────────────

vsix:package:
  stage: package
  image: node:20
  needs:
    - ts:build
  script:
    - cd extension
    - npm ci
    - npx vsce package --out openduo-${CI_COMMIT_TAG:-dev}.vsix
  artifacts:
    paths:
      - extension/openduo-*.vsix
    expire_in: 7 days
  cache:
    key: node-cache
    paths: [extension/node_modules/]

# ── RELEASE ───────────────────────────────────────────────────────

gitlab:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - vsix:package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}"
  release:
    name: "OpenDuo ${CI_COMMIT_TAG}"
    description: "OpenDuo VS Code Extension"
    tag_name: "${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "openduo-${CI_COMMIT_TAG}.vsix"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/extension/openduo-${CI_COMMIT_TAG}.vsix?job=vsix:package"
          link_type: package
